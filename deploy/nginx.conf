# AICOR reverse proxy sample (nginx).
#
# Install as /etc/nginx/conf.d/aicor.conf, replace aicor.example.com and the
# certificate paths, then run: nginx -t && systemctl reload nginx.
#
# The backend listens on 127.0.0.1:8000 (see docker-compose.yml). Only nginx
# should be reachable from the internet.

limit_req_zone $binary_remote_addr zone=aicor_api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=aicor_sse:10m;

upstream aicor_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name aicor.example.com;

    # Keep the ACME challenge reachable; redirect everything else to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name aicor.example.com;

    # Operator input: replace with the real certificate paths.
    ssl_certificate     /etc/letsencrypt/live/aicor.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aicor.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:aicor_tls:10m;
    ssl_session_timeout 1d;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 1m;

    # The backend compresses JSON above 1 KiB itself. Keep nginx gzip as a
    # second layer for clients that reach the backend without Accept-Encoding;
    # never gzip the SSE stream.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json application/javascript text/css text/plain;

    # SSE: disable buffering/caching and allow a long-lived connection.
    location = /api/events {
        limit_conn aicor_sse 4;
        proxy_pass http://aicor_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        chunked_transfer_encoding on;
    }

    # Refresh is secret-protected; rate-limit it tightly as well.
    location = /api/refresh {
        limit_req zone=aicor_api burst=5 nodelay;
        proxy_pass http://aicor_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        limit_req zone=aicor_api burst=20 nodelay;
        proxy_pass http://aicor_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

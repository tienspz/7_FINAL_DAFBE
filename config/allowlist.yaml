version: "1.2"
# CR-13 allowlist. Only domains listed here may be used by automated crawlers.
# Decisions 2026-11-05/07: Nasdaq, Google Blog, Alpha Vantage, and Tiingo.
# Tiingo is conditionally approved for adjusted-close verification only.
allowed_domains:
  - sec.gov
  - data.sec.gov
  - finance.yahoo.com
  - query1.finance.yahoo.com
  - yfinance
  - stooq.com
  - microsoft.com
  - abc.xyz
  - api.nasdaq.com
  - blog.google
  - api.tiingo.com

# Conditional domains are usable only when their requirement is met at runtime.
conditional_domains:
  - domain: api.tiingo.com
    reason: Adjusted-close cross-check only; requires a real API token.
    requires_env: TIINGO_API_KEY
    status: approved_conditional

# Domains approved by decision, kept here for traceability of the CR-13 review.
decisions:
  - domain: api.nasdaq.com
    decided_on: "2026-11-05"
    decision: approved
    scope: Secondary unadjusted close for MSFT, GOOGL, SPY, QQQ (30 trading days).
    reason: Stooq is blocked by a JavaScript challenge, so it cannot serve as a secondary close source.
  - domain: blog.google
    decided_on: "2026-11-05"
    decision: approved
    scope: Official Google/Alphabet AI announcement pages used as AI event evidence.
    reason: Needed for CR-14 AI events with an official primary source.
  - domain: alphavantage.co
    decided_on: "2026-11-05"
    decision: retired
    scope: Historical adjusted-close cross-check attempt; no longer enabled.
    reason: Free API key cannot access the daily adjusted endpoint; replaced by Tiingo.
  - domain: api.tiingo.com
    decided_on: "2026-11-07"
    decision: approved_conditional
    scope: Adjusted-close cross-check for MSFT and GOOGL only.
    reason: Alpha Vantage's free key cannot access its daily adjusted endpoint; Tiingo returned matching adjusted closes on the 2026-11-07 live check.

# Negative controls are deliberate probes of rejected sources and run outside the
# allowlist on purpose. They never contribute data to the dashboard.
negative_control_domains:
  - stooq.com
  - news.microsoft.com

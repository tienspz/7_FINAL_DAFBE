version: "1.0"
# Period-aware XBRL concept map.
# Flow metrics are converted to quarterly values; instant metrics use the
# balance-sheet value at period_end. Tags are tried in order. valid_from and
# valid_to are compared against the fact period_end.
split_adjustments:
  # Alphabet's 20:1 split began trading on 2022-07-18. Periods ending before
  # 2022-06-30 were reported on a pre-split share basis and must be divided by
  # 20 to be comparable with post-split EPS. The source value is preserved in
  # reported_value, and the metric is marked quality_flag=low.
  GOOGL:
    eps_diluted:
      split_date: "2022-07-18"
      ratio: 20
      adjust_period_end_before: "2022-06-30"
# Diagnostic tags are extracted into facts.csv for evidence and quality checks
# only. They never become one of the dashboard's company metrics.
diagnostic_tags:
  GOOGL:
    nonoperating_income:
      kind: flow
      unit: USD
      tags:
        - tag: NonoperatingIncomeExpense
    unrealized_equity_gains:
      kind: flow
      unit: USD
      tags:
        - tag: EquitySecuritiesFvNiUnrealizedGainLoss
companies:

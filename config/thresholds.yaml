version: "1.1"
analysis:
  start_year: 2022
  start_quarter: 1
  end_year: 2026
  end_quarter: 3
  price_history_start: "2020-12-01"
  financial_history_start: "2021-01-01"

quality:
  q4_residual_ok: 0.005
  q4_residual_low: 0.02
  segment_sum_tolerance: 0.005
  price_diff_tolerance: 0.001
  adjusted_close_diff_tolerance: 0.001
  adjusted_close_selfcheck_tolerance: 0.001
  filing_lag_days: 120
  restatement_min_usd: 1000000
  restatement_min_eps: 0.01
  min_price_days_for_reconciliation: 30
  price_reconciliation_sample_size: 30
  price_sample_seed: 20261104
  # DR-04.8 / FR-52 quality modes for hypothesis tests.
  # A (exclude_low): drop every low-quality quarter and list it with reasons.
  # B (label_low): keep derived quarters whose arithmetic identity is verified;
  # other low-quality reasons are still excluded in both modes.
  # B is the primary analysis; A is the sensitivity analysis.
  quality_mode_primary: "B"
  stats_quality_mode: "label_low"
  stats_quality_modes:
    - "exclude_low"
    - "label_low"
  # A quarter is flagged as a net-income one-off when the absolute
  # non-operating income exceeds this share of pre-tax income. The bridge is
  # computed from SEC facts; no financial value is hard-coded here.
  nonoperating_share_threshold: 0.10
  # Quarters excluded from the BT2 "net income growth (excl. one-off)" variant.
  # Only classification metadata is stored here; values come from SEC facts.
  net_income_one_off_quarters:
    GOOGL:
      - calendar_key: "2026-Q1"
        reason: "non-operating equity-investment gains dominate reported net income (see 10-Q)"
        evidence_accession: "0001652044-26-000048"
      - calendar_key: "2026-Q2"
        reason: "non-operating equity-investment gains dominate reported net income (see 10-Q)"
        evidence_accession: "0001652044-26-000071"
      - calendar_key: "2026-Q3"
        reason: "non-operating equity-investment losses depress reported net income (see 10-Q)"
        evidence_accession: "0001652044-26-000084"

stats:
  alpha: 0.05
  min_n_warning: 30
  max_lag: 4
  holm_family: "per company x x-variable x y-variable, lags 0..4"
  holm_primary: "bt"
  fragility_max_n: 15
  permutation_iterations: 10000
  permutation_seed: 20261107
  bt3_bootstrap_iterations: 1000
  bt3_block_length: 4
  bt3_bootstrap_seed: 20261107
  adf_regression: "c"
  adf_autolag: "AIC"
  min_n_after_exclusion: 8
  bt1_start: "2022-01-01"

snapshot:
  version_prefix: "v"

decision:
  revenue_growth_positive: 0.10
  operating_margin_positive: 0.20
  fcf_margin_positive: 0.15
  capex_intensity_caution: 0.25
  pe_caution: 35
  volatility_caution: 0.40
  drawdown_caution: -0.30

<svg width="360" height="640" viewBox="0 0 360 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="360" height="640" fill="#07090C"/>
  
  <!-- Mobile Header -->
  <rect width="360" height="48" fill="#0D1116"/>
  <line x1="0" y1="48" x2="360" y2="48" stroke="#1F2933"/>
  <rect x="12" y="16" width="18" height="14" rx="2" fill="none" stroke="#8A97A6" stroke-width="2"/>
  <text x="44" y="30" fill="#E8EDF2" font-family="Geist Sans" font-size="14" font-weight="600">Máy tính đầu tư</text>

  <!-- Form Fields -->
  <g transform="translate(16, 60)">
    <!-- Segmented Company -->
    <rect width="328" height="32" rx="4" fill="#141A21" stroke="#1F2933"/>
    <rect x="2" y="2" width="160" height="28" rx="3" fill="#0D1116"/>
    <text x="64" y="20" fill="#22E5FF" font-family="Geist Sans" font-size="12" font-weight="600">MSFT</text>
    <text x="228" y="20" fill="#8A97A6" font-family="Geist Sans" font-size="12">GOOGL</text>

    <!-- Capital Input -->
    <text x="0" y="56" fill="#8A97A6" font-family="Geist Sans" font-size="11">Vốn đầu tư (USD)</text>
    <rect y="64" width="328" height="36" rx="4" fill="#0D1116" stroke="#1F2933"/>
    <text x="12" y="87" fill="#E8EDF2" font-family="Geist Mono" font-size="14">1.000</text>

    <!-- Date Range Inputs -->
    <text x="0" y="122" fill="#8A97A6" font-family="Geist Sans" font-size="11">Ngày mua</text>
    <rect y="130" width="156" height="36" rx="4" fill="#0D1116" stroke="#1F2933"/>
    <text x="12" y="153" fill="#E8EDF2" font-family="Geist Mono" font-size="13">03/01/2022</text>

    <text x="172" y="122" fill="#8A97A6" font-family="Geist Sans" font-size="11">Ngày đánh giá</text>
    <rect x="172" y="130" width="156" height="36" rx="4" fill="#0D1116" stroke="#1F2933"/>
    <text x="184" y="153" fill="#E8EDF2" font-family="Geist Mono" font-size="13">30/09/2026</text>

    <!-- Result Card -->
    <g transform="translate(0, 185)">
      <rect width="328" height="150" rx="6" fill="#0D1116" stroke="#1F2933"/>
      <rect x="12" y="12" width="56" height="18" rx="3" fill="#141A21"/>
      <text x="18" y="25" fill="#8A97A6" font-family="Geist Sans" font-size="10">Minh họa</text>
      
      <text x="12" y="56" fill="#8A97A6" font-family="Geist Sans" font-size="12">Giá trị cuối</text>
      <text x="12" y="86" fill="#E8EDF2" font-family="Geist Mono" font-size="24" font-weight="600">$1.320</text>

      <line x1="12" y1="102" x2="316" y2="102" stroke="#1F2933"/>

      <text x="12" y="124" fill="#8A97A6" font-family="Geist Sans" font-size="11">Lợi nhuận</text>
      <text x="12" y="138" fill="#34F5A0" font-family="Geist Mono" font-size="13">+$320 (+32,0%)</text>

      <text x="180" y="124" fill="#8A97A6" font-family="Geist Sans" font-size="11">Lợi suất quy năm</text>
      <text x="180" y="138" fill="#E8EDF2" font-family="Geist Mono" font-size="13">6,2%</text>
    </g>
  </g>
</svg>

